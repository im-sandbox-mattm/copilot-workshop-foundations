spring.application.name=petcare-ops
server.port=8080

spring.datasource.url=jdbc:h2:mem:petcareops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.pool-name=petcare-dashboard-pool
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=1000

petcare.dashboard.enrichment-delay=0ms

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] requestId=%X{requestId:-none} %logger{36} - %msg%n
